<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <title>Камень, ножницы, бумага</title>
  <link rel="stylesheet" href="Game.css">
 </head>
 <body class="gamepage">
  <h1 class="title1">Начало игры</h1>
  <div class="game">
   <div class="player">
    <h2 class="h2">Игрок</h2>
    <div class="choices">
     <button class="choice" onclick="play('rock')"><img src="image/icons8-камень-64.png" alt="Камень"></button>
     <button class="choice" onclick="play('scissors')"><img src="image/icons8-ножницы-64.png" alt="Ножницы"></button>
     <button class="choice" onclick="play('paper')"><img  src="image/icons8-бумага-100.png" alt="Бумага" style="filter: brightness(0) invert(1);"></button>
    </div>
   </div>
   <div class="computer">
    <h2 class="h2">Компьютер</h2>
    <div id="computer-choice" class="choices"></div>
   </div>
  </div>
  <div id="result" class="result">
    <h2 class="h2"></h2>
    <button class="play-again" onclick="location.reload()">Сбросить игру</button>
  </div>
  <script src="Game.js"></script>
  
 </body>
</html>
